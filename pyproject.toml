[project]
name = "call_me_maybe"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "llm_sdk",
    "pydantic",
    "numpy",
]

[tool.uv.sources]
llm_sdk = { path = "llm_sdk" }

[tool.mypy]
exclude = ['^llm_sdk/']
namespace_packages = false

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.0",
]

[[tool.mypy.overrides]]
module = ["llm_sdk", "llm_sdk.*"]
ignore_missing_imports = true